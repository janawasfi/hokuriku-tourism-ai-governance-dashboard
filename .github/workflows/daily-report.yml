name: Daily Dashboard Data Refresh

on:
  schedule:
    # 21:00 UTC = 06:00 JST (next day). Adjust the hour if you want a different time.
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: hokuriku-tourism-ai-governance-dashboard

      - name: Checkout fukui-kanko-people-flow-data
        uses: actions/checkout@v4
        with:
          repository: code4fukui/fukui-kanko-people-flow-data
          path: fukui-kanko-people-flow-data

      - name: Checkout fukui-kanko-trend-report
        uses: actions/checkout@v4
        with:
          repository: code4fukui/fukui-kanko-trend-report
          path: fukui-kanko-trend-report
          submodules: recursive

      - name: Checkout fukui-kanko-survey
        uses: actions/checkout@v4
        with:
          repository: code4fukui/fukui-kanko-survey
          path: fukui-kanko-survey

      - name: Checkout opendata
        uses: actions/checkout@v4
        with:
          repository: hokuriku-inbound-kanko/opendata
          path: opendata

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: hokuriku-tourism-ai-governance-dashboard
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn pyyaml jpholiday
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run report generation script
        working-directory: hokuriku-tourism-ai-governance-dashboard
        run: PYTHONPATH=. python scripts/generate_report_data.py

      - name: Commit and push updated dashboard data
        working-directory: hokuriku-tourism-ai-governance-dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/dashboard_data.json
          git diff --staged --quiet || git commit -m "chore: daily dashboard data refresh"
          git push
